<div class="dataset-container">
  <h2>Dataset Management for Tenant: {{ tenantId }}</h2>

  <!-- Flex container to arrange the form and list side by side -->
  <div class="dataset-management">
    <!-- Create Dataset Section (Left side) -->
    <div class="section dataset-form">
      <h3>Create New Dataset</h3>
      <form [formGroup]="datasetForm" (ngSubmit)="createDataset()">
        <div class="form-group">
          <label for="datasetName">Dataset Name</label>
          <input
            id="datasetName"
            formControlName="datasetName"
            placeholder="Enter dataset name"
            required
          />
        </div>

        <div class="form-group">
          <label for="metadata">Metadata (JSON)</label>
          <textarea
            id="metadata"
            formControlName="metadata"
            placeholder="Enter metadata"
            required
          ></textarea>
        </div>

        <button type="submit">Create Dataset</button>
      </form>
    </div>

    <!-- Dataset List Section (Right side) -->
    <div class="section dataset-list">
      <h3>Dataset List</h3>
      <ul>
        <li *ngFor="let dataset of datasets" (click)="loadDatasetDetails(dataset.id)">
          {{ dataset.datasetName }}
        </li>
      </ul>
    </div>
  </div>

  <!-- Dataset Details Section (Below the form and list) -->
  <div *ngIf="selectedDataset" class="section dataset-details">
    <h3>Dataset Details: {{ selectedDataset.datasetName }}</h3>

    <!-- Update Dataset Form -->
    <form
      [formGroup]="updateDatasetForm"
      (ngSubmit)="updateDataset(selectedDataset.id)"
    >
      <div class="form-group">
        <label for="datasetName">Dataset Name</label>
        <input
          id="datasetName"
          formControlName="datasetName"
          placeholder="Enter dataset name"
          required
        />
      </div>

      <div class="form-group">
        <label for="metadata">Metadata (JSON)</label>
        <textarea
          id="metadata"
          formControlName="metadata"
          placeholder="Enter metadata"
          required
        ></textarea>
      </div>

      <button type="submit">Update Dataset</button>
    </form>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
</div>
